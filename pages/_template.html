<!DOCTYPE html>
<!--
  TutorAI page template
  ─────────────────────
  Copy this file to start a new page, then set:
    data-shell   "student" or "admin" (also the role core/auth.js requires)
    data-page    the page id from assets/js/core/navigation.js
    data-root    path back to the project root ("../../" for pages/student/*.html)
  Put only the page's own content inside <main id="page-content">.
  The sidebar, topbar, notifications and profile menu are injected by shell.js.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page · TutorAI</title>
  <meta name="description" content="TutorAI — Learn. Practise. Improve.">
  <link rel="icon" href="../../assets/img/logo-mark.svg" type="image/svg+xml">

  <!-- Fonts: DM Serif Display (editorial headings) + Inter (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5, then the TutorAI design system -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../assets/css/main.css?v=1.0.2" rel="stylesheet">
</head>
<body data-shell="student" data-page="dashboard" data-root="../../">

  <main id="page-content">
    <!-- Page content goes here -->
  </main>

  <!-- Vendor -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@1.73.0/dist/umd/lucide.min.js"></script>
  <!-- Chart.js — only on pages with charts:
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="../../assets/js/core/chart-theme.js?v=1.0.2"></script> -->

  <!-- TutorAI core (order matters) -->
  <script src="../../assets/js/core/config.js?v=1.0.2"></script>
  <script src="../../assets/js/core/utils.js?v=1.0.2"></script>
  <script src="../../assets/js/core/navigation.js?v=1.0.2"></script>
  <script src="../../assets/js/data/mock-data.js?v=1.0.2"></script>
  <script src="../../assets/js/data/lecture-content.js?v=1.0.2"></script>
  <script src="../../assets/js/services/mock-ai.js?v=1.0.2"></script>
  <script src="../../assets/js/services/quiz-engine.js?v=1.0.2"></script>
  <script src="../../assets/js/services/api.js?v=1.0.2"></script>
  <script src="../../assets/js/core/auth.js?v=1.0.2"></script>
  <script src="../../assets/js/components/ui.js?v=1.0.2"></script>
  <script src="../../assets/js/components/sidebar.js?v=1.0.2"></script>
  <script src="../../assets/js/components/notifications.js?v=1.0.2"></script>
  <script src="../../assets/js/components/topbar.js?v=1.0.2"></script>
  <script src="../../assets/js/components/palette.js?v=1.0.2"></script>
  <script src="../../assets/js/core/shell.js?v=1.0.2"></script>

  <!-- Page script (optional): ../../assets/js/pages/<page>.js -->
</body>
</html>
