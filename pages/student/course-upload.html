<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload lecture · TutorAI</title>
  <meta name="description" content="TutorAI — Learn. Practise. Improve.">
  <link rel="icon" href="../../assets/img/logo-mark.svg" type="image/svg+xml">

  <!-- Fonts: DM Serif Display (editorial headings) + Inter (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5, then the TutorAI design system -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../assets/css/main.css" rel="stylesheet">
</head>
<body class="page-upload" data-shell="student" data-page="course-upload" data-nav="courses" data-title="Upload lecture" data-root="../../">

  <main id="page-content">
    <!-- Filled by assets/js/pages/course-upload.js (form template below) -->
    <div data-upload-root>
      <span class="tai-skeleton tai-skeleton--title"></span>
      <span class="tai-skeleton tai-skeleton--block" style="height:320px;border-radius:20px"></span>
    </div>

    <template id="upload-template">
      <header class="tai-page-header">
        <div>
          <span class="tai-eyebrow" data-upload-eyebrow>Upload</span>
          <h1 class="tai-page-header__title">Upload a lecture</h1>
          <p class="tai-page-header__subtitle" data-upload-subtitle>Add a lecture PDF. TutorAI reads it so the AI Tutor and quizzes can use it.</p>
        </div>
      </header>

      <div class="alert alert-warning" role="note">
        <i data-lucide="flask-conical"></i>
        <div class="alert-body"><p class="alert-title">Demo mode — files are not uploaded or read.</p><p>The upload and processing steps are simulated. Only the file name and size are saved, in this browser.</p></div>
      </div>

      <div class="row g-4">
        <div class="col-xl-8">
          <section class="tai-card" aria-labelledby="upload-form-title">
            <h2 class="visually-hidden" id="upload-form-title">Lecture details</h2>

            <!-- 1. Form -->
            <form id="upload-form" method="post" enctype="multipart/form-data" novalidate data-upload-view="form">
              <div data-form-status></div>

              <div class="tai-field" data-course-picker hidden>
                <label class="form-label" for="upload-course">Course</label>
                <select id="upload-course" name="course_id" class="form-select"></select>
              </div>

              <div class="tai-field">
                <span class="form-label d-block" id="upload-file-label">Lecture PDF</span>
                <div class="tai-dropzone" data-dropzone>
                  <span class="tai-icon-tile tai-icon-tile--lavender tai-icon-tile--lg"><i data-lucide="file-up"></i></span>
                  <p class="tai-dropzone__title">Drag and drop a PDF here</p>
                  <p class="tai-dropzone__hint">One PDF, up to 20 MB</p>
                  <button type="button" class="btn btn-secondary btn-sm" data-action="browse"><i data-lucide="folder-open"></i><span>Browse files</span></button>
                </div>
                <div data-file-preview hidden></div>
                <input id="upload-file" name="lecture_file" type="file" class="visually-hidden" accept="application/pdf,.pdf" aria-labelledby="upload-file-label" tabindex="-1">
              </div>

              <div class="row gx-3">
                <div class="col-sm-8 tai-field">
                  <label class="form-label" for="upload-title">Lecture title</label>
                  <input id="upload-title" name="title" class="form-control" maxlength="150" placeholder="e.g. REST APIs with PHP" autocomplete="off" required>
                </div>
                <div class="col-sm-4 tai-field">
                  <label class="form-label" for="upload-number">Lecture number <span class="tai-muted fw-normal">(optional)</span></label>
                  <input id="upload-number" name="lecture_number" type="number" class="form-control" min="1" max="999" step="1" inputmode="numeric" placeholder="e.g. 6">
                </div>
              </div>

              <div class="tai-field">
                <div class="tai-field__row">
                  <label class="form-label" for="upload-description">Description <span class="tai-muted fw-normal">(optional)</span></label>
                  <span class="form-text mt-0" id="upload-description-count">0 / 500</span>
                </div>
                <textarea id="upload-description" name="description" class="form-control" rows="3" maxlength="500" placeholder="Topics covered, or anything you want the AI Tutor to know." aria-describedby="upload-description-count"></textarea>
              </div>

              <div class="d-flex flex-wrap justify-content-end gap-2 pt-2">
                <a class="btn btn-secondary" href="#" data-back-link>Cancel</a>
                <button type="submit" class="btn btn-primary"><i data-lucide="upload"></i><span>Upload lecture</span></button>
              </div>
            </form>

            <!-- 2. Progress -->
            <div data-upload-view="progress" hidden>
              <ol class="tai-stepper mb-4" data-stepper aria-label="Upload progress">
                <li class="tai-stepper__step" data-step="uploading"><span class="tai-stepper__dot"><i data-lucide="upload"></i></span>Uploading</li>
                <li class="tai-stepper__step" data-step="extracting"><span class="tai-stepper__dot"><i data-lucide="scan-text"></i></span>Extracting text</li>
                <li class="tai-stepper__step" data-step="processing"><span class="tai-stepper__dot"><i data-lucide="sparkles"></i></span>Processing</li>
                <li class="tai-stepper__step" data-step="ready"><span class="tai-stepper__dot"><i data-lucide="check"></i></span>Ready</li>
              </ol>
              <div data-progress-file></div>
              <div class="mt-4">
                <div class="tai-progress-row__head mb-2">
                  <span class="fw-semibold text-ink" data-progress-label role="status" aria-live="polite">Starting upload…</span>
                  <span class="tai-progress-row__value" data-progress-value>0%</span>
                </div>
                <div class="progress" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-progress>
                  <div class="progress-bar" style="width:0%;transition:width .2s linear"></div>
                </div>
              </div>
              <div class="d-flex justify-content-end mt-4">
                <button type="button" class="btn btn-secondary" data-action="cancel-upload"><i data-lucide="x"></i><span>Cancel upload</span></button>
              </div>
            </div>

            <!-- 3. Done -->
            <div class="text-center py-4" data-upload-view="done" hidden tabindex="-1">
              <span class="tai-icon-tile tai-icon-tile--sage tai-icon-tile--lg mx-auto mb-3"><i data-lucide="circle-check"></i></span>
              <h2 class="tai-display h3 mb-2">Lecture <em>ready</em></h2>
              <p class="tai-meta mb-4" data-done-text></p>
              <div class="d-flex flex-wrap justify-content-center gap-2">
                <a class="btn btn-primary" href="#" data-view-lecture><i data-lucide="file-text"></i><span>View lecture</span></a>
                <button type="button" class="btn btn-secondary" data-action="upload-another"><i data-lucide="plus"></i><span>Upload another</span></button>
              </div>
            </div>
          </section>
        </div>

        <div class="col-xl-4">
          <aside class="tai-card tai-card--gray" aria-labelledby="upload-help-title">
            <h2 class="tai-card__title mb-3" id="upload-help-title">What happens next</h2>
            <ol class="tai-row-list page-upload__steps">
              <li class="tai-row"><span class="tai-icon-tile tai-icon-tile--powder"><i data-lucide="upload"></i></span><div class="tai-row__main"><p class="tai-row__title">Upload</p><p class="tai-row__meta">Your PDF is sent securely to TutorAI.</p></div></li>
              <li class="tai-row"><span class="tai-icon-tile tai-icon-tile--butter"><i data-lucide="scan-text"></i></span><div class="tai-row__main"><p class="tai-row__title">Extract text</p><p class="tai-row__meta">Text is read from every page, including slides.</p></div></li>
              <li class="tai-row"><span class="tai-icon-tile tai-icon-tile--lavender"><i data-lucide="sparkles"></i></span><div class="tai-row__main"><p class="tai-row__title">Process</p><p class="tai-row__meta">The AI indexes it for the Tutor and quizzes.</p></div></li>
              <li class="tai-row"><span class="tai-icon-tile tai-icon-tile--sage"><i data-lucide="circle-check"></i></span><div class="tai-row__main"><p class="tai-row__title">Ready</p><p class="tai-row__meta">Ask questions about it or generate a quiz.</p></div></li>
            </ol>
          </aside>
        </div>
      </div>
    </template>
  </main>

  <!-- Vendor -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- TutorAI core (order matters) -->
  <script src="../../assets/js/core/config.js"></script>
  <script src="../../assets/js/core/utils.js"></script>
  <script src="../../assets/js/core/navigation.js"></script>
  <script src="../../assets/js/data/mock-data.js"></script>
  <script src="../../assets/js/data/lecture-content.js"></script>
  <script src="../../assets/js/services/mock-ai.js"></script>
  <script src="../../assets/js/services/quiz-engine.js"></script>
  <script src="../../assets/js/services/api.js"></script>
  <script src="../../assets/js/components/ui.js"></script>
  <script src="../../assets/js/core/validation.js"></script>
  <script src="../../assets/js/components/sidebar.js"></script>
  <script src="../../assets/js/components/notifications.js"></script>
  <script src="../../assets/js/components/topbar.js"></script>
  <script src="../../assets/js/components/palette.js"></script>
  <script src="../../assets/js/components/course-ui.js"></script>
  <script src="../../assets/js/core/shell.js"></script>

  <!-- Page script -->
  <script src="../../assets/js/pages/course-upload.js"></script>
</body>
</html>
