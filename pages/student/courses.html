<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Courses · TutorAI</title>
  <meta name="description" content="TutorAI — Learn. Practise. Improve.">
  <link rel="icon" href="../../assets/img/logo-mark.svg" type="image/svg+xml">

  <!-- Fonts: DM Serif Display (editorial headings) + Inter (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5, then the TutorAI design system -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../assets/css/main.css?v=1.0.1" rel="stylesheet">
</head>
<body class="page-courses" data-shell="student" data-page="courses" data-root="../../">

  <main id="page-content">
    <header class="tai-page-header">
      <div>
        <span class="tai-eyebrow">Workspace</span>
        <h1 class="tai-page-header__title">My Courses</h1>
        <p class="tai-page-header__subtitle">Every course you're studying, with its lectures, quizzes and progress.</p>
      </div>
      <div class="tai-page-header__actions">
        <button type="button" class="btn btn-primary" data-action="add-course"><i data-lucide="plus"></i><span>Add course</span></button>
      </div>
    </header>

    <form class="tai-toolbar" role="search" data-course-filters>
      <div class="tai-input-icon tai-toolbar__search">
        <i data-lucide="search"></i>
        <label class="visually-hidden" for="course-search">Search courses</label>
        <input id="course-search" name="q" type="search" class="form-control" placeholder="Search by title or code" autocomplete="off">
      </div>
      <label class="visually-hidden" for="course-term">Term</label>
      <select id="course-term" name="term" class="form-select"><option value="">All terms</option></select>
      <label class="visually-hidden" for="course-status">Status</label>
      <select id="course-status" name="status" class="form-select">
        <option value="">All statuses</option>
        <option value="active">Active</option>
        <option value="archived">Archived</option>
      </select>
    </form>

    <p class="tai-toolbar__count" data-course-count aria-live="polite"></p>
    <div class="row g-4" data-course-grid>
      <div class="col-md-6 col-xl-4"><span class="tai-skeleton tai-skeleton--block" style="height:300px;border-radius:26px"></span></div>
      <div class="col-md-6 col-xl-4"><span class="tai-skeleton tai-skeleton--block" style="height:300px;border-radius:26px"></span></div>
      <div class="col-md-6 col-xl-4 d-none d-xl-block"><span class="tai-skeleton tai-skeleton--block" style="height:300px;border-radius:26px"></span></div>
    </div>

    <!-- Add / edit course (one modal for both) -->
    <div class="modal fade" id="course-modal" tabindex="-1" aria-labelledby="course-modal-title" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" style="max-width:560px">
        <form class="modal-content" id="course-form" action="/api/courses" method="post" novalidate>
          <div class="modal-header">
            <div>
              <h2 class="modal-title" id="course-modal-title">Add a course</h2>
              <p class="modal-subtitle" data-modal-subtitle>Create a space for a course's lectures and quizzes.</p>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div data-form-status></div>
            <div class="row gx-3">
              <div class="col-sm-5 tai-field">
                <label class="form-label" for="course-code">Course code</label>
                <input id="course-code" name="code" class="form-control" maxlength="20" placeholder="COMP 3610" autocomplete="off" required>
              </div>
              <div class="col-sm-7 tai-field">
                <label class="form-label" for="course-term-input">Term</label>
                <select id="course-term-input" name="term" class="form-select" required></select>
              </div>
            </div>
            <div class="tai-field">
              <label class="form-label" for="course-title">Course title</label>
              <input id="course-title" name="title" class="form-control" maxlength="120" placeholder="Advanced Web Programming" autocomplete="off" required>
            </div>
            <div class="tai-field">
              <label class="form-label" for="course-instructor">Instructor <span class="tai-muted fw-normal">(optional)</span></label>
              <input id="course-instructor" name="instructor" class="form-control" maxlength="80" placeholder="Dr. Priya Raman" autocomplete="off">
            </div>
            <fieldset class="tai-field">
              <legend class="form-label" id="course-color-label">Colour</legend>
              <div class="tai-swatches" role="radiogroup" aria-labelledby="course-color-label" data-swatches></div>
            </fieldset>
            <div class="tai-field">
              <div class="tai-field__row">
                <label class="form-label" for="course-description">Description <span class="tai-muted fw-normal">(optional)</span></label>
                <span class="form-text mt-0" id="course-description-count">0 / 1000</span>
              </div>
              <textarea id="course-description" name="description" class="form-control" rows="3" maxlength="1000" placeholder="What the course covers, in a sentence or two." aria-describedby="course-description-count"></textarea>
            </div>
            <div class="tai-field mb-0" data-edit-only hidden>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="course-archived" name="status" value="archived">
                <label class="form-check-label" for="course-archived">Archive this course <span class="tai-muted">(it stays in My Courses, filtered as Archived)</span></label>
              </div>
            </div>
          </div>
          <div class="modal-footer mt-2">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary"><span data-submit-label>Add course</span></button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Vendor -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@1.73.0/dist/umd/lucide.min.js"></script>

  <!-- TutorAI core (order matters) -->
  <script src="../../assets/js/core/config.js?v=1.0.1"></script>
  <script src="../../assets/js/core/utils.js?v=1.0.1"></script>
  <script src="../../assets/js/core/navigation.js?v=1.0.1"></script>
  <script src="../../assets/js/data/mock-data.js?v=1.0.1"></script>
  <script src="../../assets/js/data/lecture-content.js?v=1.0.1"></script>
  <script src="../../assets/js/services/mock-ai.js?v=1.0.1"></script>
  <script src="../../assets/js/services/quiz-engine.js?v=1.0.1"></script>
  <script src="../../assets/js/services/api.js?v=1.0.1"></script>
  <script src="../../assets/js/core/auth.js?v=1.0.1"></script>
  <script src="../../assets/js/components/ui.js?v=1.0.1"></script>
  <script src="../../assets/js/core/validation.js?v=1.0.1"></script>
  <script src="../../assets/js/components/sidebar.js?v=1.0.1"></script>
  <script src="../../assets/js/components/notifications.js?v=1.0.1"></script>
  <script src="../../assets/js/components/topbar.js?v=1.0.1"></script>
  <script src="../../assets/js/components/palette.js?v=1.0.1"></script>
  <script src="../../assets/js/components/course-ui.js?v=1.0.1"></script>
  <script src="../../assets/js/core/shell.js?v=1.0.1"></script>

  <!-- Page script -->
  <script src="../../assets/js/pages/courses.js?v=1.0.1"></script>
</body>
</html>
